# Acutize — Render Blueprint (use this file only; api/render.yaml is legacy).
# Docs: DEPLOY.md
#
# Temporary pre-campaign layout (July 2026):
#   - Starter API + Starter Web while the marketing campaign is delayed
#   - Persistent Starter Key Value for shared rate limits + Celery job queue
#   - One Standard Celery worker processing one memory-heavy job at a time
#   - Re-upgrade API to Standard and add acutize-worker-2 before campaign traffic
#   - Supabase (auth/DB/storage) billed separately

services:
  # -------------------------
  # 1. FastAPI Backend
  # -------------------------
  - type: web
    name: acutize-api
    runtime: python
    plan: starter
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-2}
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: REDIS_URL
        fromService:
          type: redis
          name: acutize-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_ENVIRONMENT
        value: production
      - key: PADDLE_PRICE_ID_PRO
        sync: false
      - key: PADDLE_PRICE_ID_PRO_YEARLY
        sync: false
      - key: PADDLE_PRICE_ID_BUSINESS
        sync: false
      - key: PADDLE_PRICE_ID_BUSINESS_YEARLY
        sync: false
      - key: PADDLE_CUSTOM_CREDIT_PRICE_IDS
        sync: false
      - key: PADDLE_CHECKOUT_URL
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: BILLING_ENFORCEMENT_ENABLED
        value: "true"
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_VERSION
        value: "0.1.0"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ADMIN_CLEANUP_TOKEN
        sync: false
      - key: BACKGROUND_JOBS_ENABLED
        value: "true"
      - key: MAX_QUEUED_JOBS_PER_WORKSPACE
        value: "200"
      - key: JOB_STALE_TIMEOUT_MINUTES
        value: "120"

  # -------------------------
  # 1.25. Primary Background Job Worker + singleton scheduler
  # -------------------------
  - type: worker
    name: acutize-worker
    runtime: python
    plan: starter
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_worker worker --beat --loglevel=info --concurrency=${WORKER_CONCURRENCY:-1}
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: REDIS_URL
        fromService:
          type: redis
          name: acutize-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: BILLING_ENFORCEMENT_ENABLED
        value: "true"
      - key: WORKER_ID
        value: render-worker-1
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: JOB_STALE_TIMEOUT_MINUTES
        value: "120"
      - key: JOB_RECOVERY_INTERVAL_MINUTES
        value: "15"
      - key: TTL_CLEANUP_ENABLED
        # TTL cleanup is handled by acutize-ttl-cron below. Keep Celery beat
        # responsible only for stale-job recovery so cleanup is not duplicated.
        value: "false"
      - key: DATASET_TTL_HOURS
        value: "720"
      - key: SHARED_REPORT_TTL_HOURS
        value: "720"
      - key: TTL_CLEANUP_INTERVAL_MINUTES
        value: "60"

  # -------------------------
  # 1.5. TTL Cleanup Cron Job
  # -------------------------
  - type: cron
    name: acutize-ttl-cron
    runtime: python
    plan: starter
    schedule: "0 * * * *"
    rootDir: api
    buildCommand: pip install requests
    startCommand: python cron_cleanup.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: API_URL
        sync: false
      - key: ADMIN_CLEANUP_TOKEN
        sync: false

  # -------------------------
  # 2. Next.js Frontend
  # -------------------------
  - type: web
    name: acutize-web
    runtime: node
    plan: starter
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_BILLING_ENFORCEMENT_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_PADDLE_ENVIRONMENT
        value: production
      - key: NEXT_PUBLIC_PADDLE_CLIENT_TOKEN
        sync: false

  # -------------------------
  # 3. Persistent Key Value (rate limiting + durable Celery job queue)
  # -------------------------
  - type: redis
    name: acutize-redis
    plan: free
    ipAllowList: []
    # Queue entries must never be evicted under memory pressure.
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
