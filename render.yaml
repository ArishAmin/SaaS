# Acutize — Render Blueprint (use this file only; api/render.yaml is legacy).
# Docs: DEPLOY.md
#
# Cost-focused layout (May 2026):
#   - API + Web on Starter ($7/mo each) = $14/mo compute
#   - Redis Free for shared rate limits (upgrade to Starter $10/mo if you scale API replicas)
#   - No Celery worker (full training runs on the user's machine via export; TTL cleanup runs by cron)
#   - Supabase (auth/DB/storage) billed separately — Free tier OK for launch, Pro ~$25/mo when you grow
#   - Render workspace: Hobby $0 (cold starts) or Pro $25/mo for always-on production

services:
  # -------------------------
  # 1. FastAPI Backend
  # -------------------------
  - type: web
    name: acutize-api
    runtime: python
    plan: starter
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: REDIS_URL
        fromService:
          type: redis
          name: acutize-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_ENVIRONMENT
        value: production
      - key: PADDLE_PRICE_ID_PRO
        sync: false
      - key: PADDLE_PRICE_ID_PRO_YEARLY
        sync: false
      - key: PADDLE_PRICE_ID_BUSINESS
        sync: false
      - key: PADDLE_PRICE_ID_BUSINESS_YEARLY
        sync: false
      - key: PADDLE_CUSTOM_CREDIT_PRICE_IDS
        sync: false
      - key: PADDLE_CHECKOUT_URL
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: BILLING_ENFORCEMENT_ENABLED
        value: "true"
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_VERSION
        value: "0.1.0"
      - key: ADMIN_CLEANUP_TOKEN
        sync: false
      - key: TTL_CLEANUP_ENABLED
        value: "true"
      - key: DATASET_TTL_HOURS
        value: "720"
      - key: SHARED_REPORT_TTL_HOURS
        value: "720"
      - key: TTL_CLEANUP_INTERVAL_MINUTES
        value: "60"

  # -------------------------
  # 1.5. TTL Cleanup Cron Job
  # -------------------------
  - type: cron
    name: acutize-ttl-cron
    runtime: python
    plan: starter
    schedule: "0 * * * *"
    rootDir: api
    buildCommand: pip install requests
    startCommand: python cron_cleanup.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: API_URL
        sync: false
      - key: ADMIN_CLEANUP_TOKEN
        sync: false

  # -------------------------
  # 2. Next.js Frontend
  # -------------------------
  - type: web
    name: acutize-web
    runtime: node
    plan: starter
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_BILLING_ENFORCEMENT_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_PADDLE_ENVIRONMENT
        value: production
      - key: NEXT_PUBLIC_PADDLE_CLIENT_TOKEN
        sync: false

  # -------------------------
  # 3. Redis (rate limiting; optional TTL worker removed)
  # -------------------------
  - type: redis
    name: acutize-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
