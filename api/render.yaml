# DEPRECATED — use the repo root render.yaml for Render Blueprint deployments.
services:
  # Web Service (API)
  - type: web
    name: datapiot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acutize-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: acutize-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Background Worker
  - type: worker
    name: acutize-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_worker worker --loglevel=info --concurrency=1
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: acutize-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Redis Instance
  - type: redis
    name: acutize-redis
    ipAllowList: [] # Only allow internal connections
    plan: free
